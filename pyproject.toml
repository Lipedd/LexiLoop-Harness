[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiloop-harness"
version = "0.1.0"
description = "A local coding agent with an observable, recoverable harness"
requires-python = ">=3.10"
dependencies = [
  "prompt-toolkit>=3.0,<4",
]

[project.scripts]
lexi = "lexiloop.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["lexiloop*"]

[tool.setuptools.package-data]
lexiloop = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
